<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | Lumen Aether Bank (LAFP)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/careers.css">
</head>

<body>

    <!-- Fixed Navigation Bar -->
    <div class="nav-con">
        <nav class="nav">
            <navbar class="navbar">
                <div class="logo-con">
                    <span>
                        <a href="/">LAFP</a>
                    </span>
                </div>
                <div class="asset-con">
                    <div class="btn-con">
                        <div class="btn" style="color: white; border: 2px solid white;">
                            <a href="/signup" style="text-decoration: none;">
                                <p style="color: white; font-size: 20px; font-weight: 900;">Job Search</p>
                            </a>
                        </div>
                    </div>
                </div>
            </navbar>
        </nav>
    </div>

    <!-- Careers Hero Section -->
    <section class="careers-hero-section">
        <div class="careers-hero-container">

            <!-- Left: Simulated Image Box with Offset Green Accent Card -->
            <div class="careers-image-wrapper">
                <div class="careers-accent-backdrop"></div>
                <div class="careers-image-box" id="careers-image-box">
                    <!-- Simulated Box Placeholder (Replace this inner div with <img src="..." alt="Team" /> when ready) -->
                    <div class="careers-simulated-content">
                        <div class="simulated-icon">
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </div>
                        <span class="simulated-label">Team Photo</span>
                        <span class="simulated-subtext">Simulated box &mdash; add your team image here</span>
                    </div>
                </div>
            </div>

            <!-- Right: Content & Typography -->
            <div class="careers-content-col">
                <p class="careers-hero-kicker">Join the team that’s redefining</p>
                <h1 class="careers-hero-title">the future of banking and payments</h1>
                <p class="careers-hero-desc">
                    We are a purpose-driven company founded on stewardship, trust, action, performance, and teamwork. Every day we look for ways to optimize and improve.
                </p>
            </div>

        </div>
    </section>

</body>

</html>
